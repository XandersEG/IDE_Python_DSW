<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea - IDE DSW</title>
    <link rel="stylesheet" href="/dsw/public/assets/css/tarea.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-logo">
            <span class="logo-text">IDE DSW</span>
        </div>
        <div class="navbar-right">
            <span class="welcome">Hola, <strong id="userName"></strong></span>
            <a href="#" class="btn-logout" id="logoutLink">Cerrar sesión</a>
        </div>
    </nav>

    <div class="page">
        <div class="page-header">
            <a href="#" id="backLink" class="btn-back">&#8592; Volver</a>
            <h2 id="taskTitle">Cargando tarea...</h2>
            <p class="tarea-descripcion" id="taskDescription"></p>
            <p class="tarea-fecha-limite">Fecha límite: <strong id="taskFecha"></strong></p>
        </div>

        <div class="error-box" id="messageBox" style="display:none;"></div>
    </div>

    <script src="/dsw/public/auth.js"></script>
    <script>
        const auth = IDEAuth.requireAuth();
        if (!auth) throw new Error('No autorizado');

        document.getElementById('userName').textContent = auth.payload.nombre || auth.payload.correo;
        IDEAuth.attachLogout('logoutLink');

        const params = new URLSearchParams(window.location.search);
        const idTarea = params.get('id') || '';
        const nombreCurso = params.get('nombre') || '';
        const correoProfesor = params.get('profe') || '';
        const messageBox = document.getElementById('messageBox');
        document.getElementById('backLink').href = `/dsw/public/tareas?nombre=${encodeURIComponent(nombreCurso)}&modo=estudiante&profe=${encodeURIComponent(correoProfesor)}`;

        function mostrarError(mensaje) {
            messageBox.textContent = mensaje;
            messageBox.className = 'error-box';
            messageBox.style.display = 'block';
        }

        function formatearFecha(fecha) {
            if (!fecha) return '';
            const d = new Date(fecha);
            return d.toLocaleDateString('es-CR', { 
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        if (!idTarea) {
            mostrarError('No se indicó la tarea a consultar.');
        } else {
            (async function cargarTarea() {
                try {
                    const data = await IDEAuth.fetchJson(`/api/verTarea?id=${encodeURIComponent(idTarea)}`);
                    if (!data) return;

                    document.getElementById('taskTitle').textContent = data.tarea.Titulo || 'Tarea';
                    document.getElementById('taskDescription').textContent = data.tarea.Descripcion || '';
                    document.getElementById('taskFecha').textContent = formatearFecha(data.tarea.FechaLimite || '');
                } catch (error) {
                    mostrarError(error.message);
                }
            })();
        }
    </script>

</body>
</html>
