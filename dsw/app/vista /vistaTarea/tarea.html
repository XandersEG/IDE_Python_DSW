<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea - IDE DSW</title>
    <link rel="stylesheet" href="/dsw/public/assets/css/tarea.css">
</head>
<body>

    <nav class="navbar">
        <div class="navbar-logo">
            <span class="logo-text">IDE DSW</span>
        </div>
        <div class="navbar-right">
            <span class="welcome">Hola, <strong id="userName"></strong></span>
            <a href="#" class="btn-logout" id="logoutLink">Cerrar sesión</a>
        </div>
    </nav>

    <div class="page">
        <div class="page-header">
            <a href="#" id="backLink" class="btn-back">&#8592; Volver</a>
            <div class="header-top">
                <h2 id="taskTitle">Cargando tarea...</h2>
            </div>
            <p class="tarea-descripcion" id="taskDescription"></p>
            <button class="btn-editar" onclick="abrirModal()">Editar tarea</button>
        </div>

        <div class="error-box" id="messageBox" style="display:none;"></div>
        <div id="content"></div>
    </div>

    <!-- Modal editar tarea -->
    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <div class="modal-header">
                <h3>Editar tarea</h3>
                <button class="modal-close" onclick="cerrarModal()">&times;</button>
            </div>
            <div class="error-box" id="modalError" style="display:none;"></div>
            <div class="form-group">
                <label>Título</label>
                <input type="text" id="editTitulo" placeholder="Título de la tarea">
            </div>
            <div class="form-group">
                <label>Descripción</label>
                <textarea id="editDescripcion" placeholder="Descripción de la tarea"></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-crear" onclick="guardarCambios()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="/dsw/public/auth.js"></script>
    <script>
        const auth = IDEAuth.requireAuth();
        if (!auth) throw new Error('No autorizado');

        document.getElementById('userName').textContent = auth.payload.nombre || auth.payload.correo;
        IDEAuth.attachLogout('logoutLink');

        const params = new URLSearchParams(window.location.search);
        const idTarea = params.get('id') || '';
        const nombreCurso = params.get('nombre') || '';
        const messageBox = document.getElementById('messageBox');
        const content = document.getElementById('content');
        document.getElementById('backLink').href = `/dsw/public/tareas?nombre=${encodeURIComponent(nombreCurso)}`;

        function mostrarError(mensaje) {
            messageBox.textContent = mensaje;
            messageBox.className = 'error-box';
            messageBox.style.display = 'block';
        }

        function mostrarExito(mensaje) {
            messageBox.textContent = mensaje;
            messageBox.className = 'success-box';
            messageBox.style.display = 'block';
        }

        function abrirModal() {
            document.getElementById('editTitulo').value = document.getElementById('taskTitle').textContent;
            document.getElementById('editDescripcion').value = document.getElementById('taskDescription').textContent;
            document.getElementById('modalError').style.display = 'none';
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }

        async function guardarCambios() {
            const titulo = document.getElementById('editTitulo').value.trim();
            const descripcion = document.getElementById('editDescripcion').value.trim();
            const modalError = document.getElementById('modalError');

            if (!titulo || !descripcion) {
                modalError.textContent = 'Por favor completa todos los campos.';
                modalError.style.display = 'block';
                return;
            }

            try {
                const data = await IDEAuth.fetchJson('/api/editarTarea', {
                    method: 'POST',
                    body: { id: idTarea, titulo, descripcion }
                });

                if (data.exito) {
                    document.getElementById('taskTitle').textContent = titulo;
                    document.getElementById('taskDescription').textContent = descripcion;
                    cerrarModal();
                    mostrarExito('Tarea actualizada correctamente.');
                } else {
                    modalError.textContent = data.mensaje;
                    modalError.style.display = 'block';
                }
            } catch (error) {
                modalError.textContent = error.message;
                modalError.style.display = 'block';
            }
        }

        function renderEstudiantes(estudiantes) {
            if (!estudiantes.length) {
                content.innerHTML = `
                    <div class="empty-state">
                        <p>Ningún estudiante ha realizado una entrega para esta tarea.</p>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="estudiantes-lista">
                    <div class="lista-header">
                        <span>Estudiante</span>
                        <span>Entrega</span>
                    </div>
                    ${estudiantes.map((estudiante) => `
                        <div class="estudiante-item">
                            <span class="estudiante-nombre">
                                ${estudiante.PrimerNombre || ''} ${estudiante.PrimerApellido || ''}
                            </span>
                            <a href="/dsw/public/api/descargarEntrega?id=${encodeURIComponent(estudiante.idEntrega || '')}" class="btn-descargar">
                                &#8595; Descargar
                            </a>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        if (!idTarea) {
            mostrarError('No se indicó la tarea a consultar.');
        } else {
            (async function cargarTarea() {
                try {
                    const data = await IDEAuth.fetchJson(`/api/verTarea?id=${encodeURIComponent(idTarea)}`);
                    if (!data) return;

                    document.getElementById('taskTitle').textContent = data.tarea.Titulo || 'Tarea';
                    document.getElementById('taskDescription').textContent = data.tarea.Descripcion || '';
                    renderEstudiantes(data.estudiantes || []);
                } catch (error) {
                    mostrarError(error.message);
                }
            })();
        }
    </script>

</body>
</html>
